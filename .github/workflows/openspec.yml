name: OpenSpec validation and repository integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.1
      - name: Validate all OpenSpec changes
        run: openspec validate --all
      - name: Check repository contract
        shell: pwsh
        run: |
          $required = @(
            "AGENTS.md",
            "DESIGN.md",
            "docs/README.md",
            "openspec/config.yaml",
            ".github/AGENTS.md",
            ".github/PULL_REQUEST_TEMPLATE.md"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            throw "Missing repository contract files: $($missing -join ', ')"
          }
          git diff --check
      - name: Install GH-AW compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.88.8
      - name: Validate GH-AW sources
        run: |
          gh aw compile --no-check-update \
            --no-emit \
            --action-mode action \
            --action-tag 5e508589e03a7757a7e05b26e834292f5445bfb6
      - name: Summarize integrity evidence
        if: always()
        run: |
          {
            echo "## Repository integrity"
            echo "- OpenSpec validation: ${{ job.status }}"
            echo "- GH-AW sources validated with the pinned compiler and action SHA."
            echo "- Generated lock drift is reviewed separately until compiler output is platform-stable."
          } >> "$GITHUB_STEP_SUMMARY"
