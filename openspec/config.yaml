schema: spec-driven

context: |
  This repository supports a four-hour Agentic SDLC workshop.
  OpenSpec is the canonical spec-driven development workflow.
  Root DESIGN.md contains durable architecture and repository boundaries.
  Root and co-located AGENTS.md files provide progressively disclosed agent guidance.
  Azure infrastructure uses pinned Azure Verified Modules.
  GitHub Actions authenticates to Azure with OIDC.
  Changes must produce deterministic test, security, and deployment evidence.
  Required participant commands and paths must work on Windows.

rules:
  proposal:
    - Identify the user or operator problem and why the change is needed now.
    - State explicit non-goals and affected repository areas.
    - Identify application, test, infrastructure, workflow, security, and documentation impact.
  specs:
    - Describe observable behavior rather than implementation details.
    - Give every requirement at least one concrete WHEN/THEN scenario.
    - Include failure, boundary, authorization, and accessibility scenarios when applicable.
    - Write scenarios that can map to automated tests or deployment evidence.
  design:
    - Reference applicable constraints in root DESIGN.md.
    - Record decisions, rationale, alternatives considered, risks, and rollback approach.
    - Describe AVM, identity, security, observability, and migration impact when applicable.
    - Identify any durable decision that must update root DESIGN.md or an architecture decision record.
  tasks:
    - Keep tasks bounded enough for one agent context.
    - Give parallel tasks non-overlapping primary file ownership.
    - Include the validation command or observable completion evidence for each task group.
    - Include tests, documentation, security, and deployment work where applicable.

operations:
  apply:
    guidance:
      - Read root and co-located AGENTS.md files before editing.
      - Implement one bounded task at a time and keep tasks.md current.
      - Run focused validation before broader checks.
      - Do not weaken tests, security controls, workflow permissions, or deployment gates.
  archive:
    guidance:
      - Archive only after requirements, tests, security checks, and deployment evidence are complete.
      - Summarize durable architecture or harness updates made by the change.

githubCopilot:
  cloudAgent: true

