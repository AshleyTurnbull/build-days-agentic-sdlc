name: OpenSpec specification PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a linked, reviewable OpenSpec change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          governed="$(printf '%s\n' "$changed" | grep -E '^(src/|tests/|infra/|package(-lock)?\.json$|\.github/(workflows|actions)/)' || true)"

          if [ -z "$governed" ]; then
            echo "No material governed paths changed."
            exit 0
          fi

          change_path="$(printf '%s' "$PR_BODY" | grep -Eo 'openspec/changes/[A-Za-z0-9._-]+/?' | head -n 1 || true)"
          change_path="${change_path%/}"
          if [ -z "$change_path" ]; then
            echo "::error::Material paths changed without an OpenSpec link in the PR body. Add openspec/changes/<change-name>/."
            printf 'Governed paths:\n%s\n' "$governed"
            exit 1
          fi

          for required in proposal.md design.md tasks.md; do
            if [ ! -f "$change_path/$required" ]; then
              echo "::error::$change_path/$required is missing."
              exit 1
            fi
          done
          if ! find "$change_path/specs" -name spec.md -type f -print -quit | grep -q .; then
            echo "::error::$change_path/specs must contain at least one capability spec."
            exit 1
          fi

          spec_pr_number="$(
            printf '%s\n' "$PR_BODY" |
              sed -nE 's/^[[:space:]]*-[[:space:]]*Specification PR:[[:space:]]*#([0-9]+).*$/\1/p' |
              head -n 1
          )"
          if [ -z "$spec_pr_number" ]; then
            echo "::error::Material changes require a merged specification PR. Add '- Specification PR: #<number>' to the PR body."
            exit 1
          fi

          merged_at="$(gh pr view "$spec_pr_number" --json mergedAt --jq '.mergedAt // empty')"
          if [ -z "$merged_at" ]; then
            echo "::error::Specification PR #$spec_pr_number is not merged."
            exit 1
          fi

          if ! gh pr view "$spec_pr_number" --json files --jq '.files[].path' |
            grep -Fxq "$change_path/proposal.md"; then
            echo "::error::Specification PR #$spec_pr_number did not approve $change_path."
            exit 1
          fi

          echo "Material paths are linked to approved change $change_path through specification PR #$spec_pr_number."
